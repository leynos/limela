# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
# Published upstream titles: Azure Architecture Center and a Hacker News item
# containing "pasta-flavored".
accepted = ["Center", "flavored"]

[words.corrections]

[patterns]
ignore = [
  # "mold" names the linker (https://github.com/rui314/mold) in these
  # contexts only; the mould correction stays active elsewhere.
  "-fuse-ld=mold",
  "mold linker",
  "Cranelift \\+ mold",
  "Cranelift and mold",
  "`mold`",
]

[files]
exclude = []
