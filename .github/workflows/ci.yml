name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@bd052c68a4792e92c3272fb1b6ea3b594f3ab7f3
        with:
          install-mold: 'true'
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@bd052c68a4792e92c3272fb1b6ea3b594f3ab7f3
        with:
          version: "0.6.1"

      - name: Format
        run: make check-fmt
      - name: Spelling
        run: make spelling
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34
        with:
          globs: '**/*.md'
      - name: Install Whitaker
        uses: leynos/shared-actions/.github/actions/install-whitaker@bd052c68a4792e92c3272fb1b6ea3b594f3ab7f3
        with:
          cranelift: true
      - name: Lint
        run: make lint
      - name: Setup uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          # A Rust-only repository has no Python dependency manifest for the
          # cache key, so caching would only warn about unmatched inputs.
          enable-cache: false
      - name: Workflow contract tests
        run: make test-workflow-contracts
      - name: Test and Measure Coverage
        env:
          # One of the two exclusions from the build standard: a coverage build is
          # a measurement, so it takes neither the parallel frontend nor the mold
          # linker. Assigning RUSTFLAGS displaces every `rustflags` table in
          # .cargo/config.toml.
          RUSTFLAGS: -D warnings
        uses: leynos/shared-actions/.github/actions/generate-coverage@bd052c68a4792e92c3272fb1b6ea3b594f3ab7f3
        with:
          allow-no-tests: 'true'
          output-path: lcov.info
          format: lcov
          # The pull request measures coverage for its own ratchet check and
          # nothing else: it neither publishes the report nor contacts
          # CodeScene. Main owns both, in coverage-main.yml, and
          # `make test-workflow-contracts` holds the split.
          with-ratchet: 'true'
          publish-artefact: 'false'
